name: ETH Spot v0.1 Replay Audit
on:
  push:
    branches: [audit/spot-v01-replay-20260915]
    paths:
      - 'audit/spot_v01_replay.py'
      - 'audit/spot_v01_canonical_to_csv.py'
      - '.github/workflows/spot-v01-replay.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/spot-v01-replay-20260915
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run canonical Spot replay
        run: |
          set -o pipefail
          python audit/spot_v01_replay.py | tee spot-replay.log
      - name: Materialize canonical calibration CSV
        run: python audit/spot_v01_canonical_to_csv.py
      - name: Persist audit evidence on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/spot_v01_result.json audit/spot_v01_result.pretty.json audit/spot_v01_canonical_current.json audit/spot_v01_canonical_current.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize ETH Spot v0.1 replay evidence'
            git push origin HEAD:audit/spot-v01-replay-20260915
          fi
